<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국몰드 AI 오피스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <div class="logo-mark">HK</div>
      <div><b>한국몰드 AI 오피스</b><small>부서 · 사람 · 업무 현황</small></div>
    </div>
    <nav class="tabs">
      <button class="tab" data-route="monitor">📊 모니터링</button>
      <button class="tab" data-route="office">🏢 오피스</button>
      <button class="tab" data-route="reports">📁 보고함 <span class="badge" id="rep-badge"></span></button>
    </nav>
    <div class="top-right">
      <button class="pill" id="voice">🔈 음성 알림</button>
      <span class="pill"><i class="live-dot"></i><span class="clock" id="clock"></span></span>
    </div>
  </header>

  <main>
    <!-- 모니터링 -->
    <section class="view monitor" id="view-monitor">
      <div class="mon-main">
        <div class="card hero" id="hero"></div>
        <div class="stats" id="stats"></div>
        <div class="card section">
          <div class="section-head">
            <h3>부서 <small>4개 팀 · AI 직원 4명</small></h3>
            <a href="#/office">오피스에서 보기 →</a>
          </div>
          <div class="teams" id="teams"></div>
        </div>
      </div>
      <aside class="side">
        <div class="card section">
          <div class="section-head"><h3>다가오는 일정</h3><span class="count">2주</span></div>
          <div id="schedule"></div>
          <p class="sample-note">※ 예시 일정입니다.</p>
        </div>
        <div class="card section">
          <div class="section-head"><h3>사람</h3><span class="count">4명</span></div>
          <div class="people" id="people"></div>
        </div>
      </aside>
    </section>

    <!-- 오피스 타워 -->
    <section class="view office" id="view-office" hidden>
      <div>
        <div class="tower" id="tower">
          <div class="tower-ui">
            <div class="floor-chips" id="floor-chips"></div>
            <div class="ticker" id="ticker"></div>
          </div>
          <svg id="tower-svg" viewBox="0 0 820 860" preserveAspectRatio="xMidYMid meet" aria-label="한국몰드 AI 오피스 건물"></svg>
          <div class="floor-card" id="floor-card" hidden></div>
        </div>
        <div class="legend">
          <span><i style="background:var(--ok)"></i>업무 중</span>
          <span><i style="background:var(--meet)"></i>회의 중</span>
          <span><i style="background:var(--rest)"></i>휴식</span>
        </div>
      </div>
      <aside class="card chat">
        <div class="chat-head">
          <div class="logo-mark">HK</div>
          <div><b>한국몰드 AI 오피스 단톡방</b><small>AI 직원 4명 · 실시간</small></div>
        </div>
        <div class="chat-tabs" id="chat-tabs">
          <button data-tab="talk" class="on">💬 단톡방</button>
          <button data-tab="files">📁 자료</button>
          <button data-tab="ask">🤖 AI에게 묻기</button>
        </div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-foot" id="chat-foot">
          <input id="chat-input" placeholder="메시지 입력…" autocomplete="off">
          <button id="chat-send">전송</button>
        </div>
      </aside>
    </section>

    <!-- 보고함 -->
    <section class="view reports" id="view-reports" hidden>
      <div class="card section">
        <div class="section-head"><h3>보고함</h3><span class="count">업무 결과 · 정리 자료</span></div>
        <div class="rep-list" id="rep-list"></div>
      </div>
      <div class="card viewer" id="viewer"><p class="empty">왼쪽에서 보고서를 고르면 내용이 여기에 표시됩니다.</p></div>
    </section>
  </main>

  <dialog id="person-dlg"><div class="dlg" id="person-body"></div></dialog>

  <script src="app.js"></script>
</body>
</html>
