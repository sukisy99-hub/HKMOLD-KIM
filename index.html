<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국몰드 AI 오피스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --accent: #0047ab;
      --accent-soft: #e6eefa;
      --bg: #f4f6fa;
      --surface: #ffffff;
      --text: #16202e;
      --muted: #667085;
      --line: #e3e8ef;
      --wall: #eaf0f8;
      --floor: #d9e1ec;
      --desk: #c9a27a;
      --desk-edge: #a8825c;
      --ok: #12a150;
      --meet: #e08a00;
      --rest: #8a94a6;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 16px rgba(16, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #5b8def;
        --accent-soft: #1b2740;
        --bg: #0e131b;
        --surface: #161d28;
        --text: #e7ecf3;
        --muted: #98a2b3;
        --line: #263042;
        --wall: #1c2636;
        --floor: #243044;
        --desk: #8a6a4c;
        --desk-edge: #6b513a;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: Pretendard, system-ui, "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .brand small { display: block; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    .brand h1 { margin: 2px 0 0; font-size: 20px; }
    .clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat { background: var(--accent-soft); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
    .stat b { color: var(--accent); font-variant-numeric: tabular-nums; }

    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
    .office { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start; }

    .room {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); overflow: hidden; cursor: pointer; text-align: left;
      font: inherit; color: inherit; padding: 0; transition: transform .15s, border-color .15s;
    }
    .room:hover, .room:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .room-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .team { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
    .state { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .state[data-s="meet"] .dot { background: var(--meet); }
    .state[data-s="rest"] .dot { background: var(--rest); }
    .state[data-s="work"] .dot { animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .scene { position: relative; }
    .scene svg { display: block; width: 100%; height: auto; }
    .bubble {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 6px 10px; font-size: 12px; white-space: nowrap; box-shadow: var(--shadow);
      max-width: 90%; overflow: hidden; text-overflow: ellipsis; animation: pop .3s ease;
    }
    @keyframes pop { from { opacity: 0; transform: translate(-50%, 4px); } }

    .room-foot { padding: 12px 16px 16px; }
    .who { display: flex; align-items: baseline; gap: 8px; }
    .who b { font-size: 16px; }
    .who span { font-size: 12px; color: var(--muted); }
    .task { font-size: 13px; margin: 6px 0 8px; min-height: 1.4em; }
    .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .8s; }

    .feed { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; max-height: calc(100vh - 120px); position: sticky; top: 20px; }
    .feed h2 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .feed ol { list-style: none; margin: 0; padding: 8px 16px; overflow-y: auto; flex: 1; }
    .feed li { font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--line); animation: pop .3s ease; }
    .feed li time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-right: 6px; }
    .feed li .tag { font-weight: 700; color: var(--accent); }

    /* SVG character animation */
    .head { animation: bob 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes bob { 50% { transform: translateY(1.5px); } }
    .eyes { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    .hand-l { animation: type .3s infinite alternate; }
    .hand-r { animation: type .3s .15s infinite alternate; }
    @keyframes type { to { transform: translateY(-3px); } }
    .screen-line { animation: scan 2.2s linear infinite; }
    @keyframes scan { 0% { opacity: .3; } 50% { opacity: 1; } 100% { opacity: .3; } }
    .room[data-s="meet"] .hand-l, .room[data-s="meet"] .hand-r,
    .room[data-s="rest"] .hand-l, .room[data-s="rest"] .hand-r { animation: none; }
    .room[data-s="rest"] .person { opacity: .35; }
    .steam { animation: steam 2s ease-in-out infinite; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 50% { opacity: .8; } 100% { opacity: 0; transform: translateY(-6px); } }

    /* Detail drawer */
    dialog {
      border: none; padding: 0; width: min(440px, calc(100vw - 32px)); border-radius: 16px;
      background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    dialog::backdrop { background: rgba(10, 16, 28, .45); }
    .d-head { padding: 20px 20px 12px; border-bottom: 1px solid var(--line); position: relative; }
    .d-head h3 { margin: 6px 0 2px; font-size: 20px; }
    .d-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .close { position: absolute; top: 14px; right: 14px; border: none; background: var(--accent-soft); color: var(--text);
      width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    .d-body { padding: 16px 20px 20px; }
    .d-body h4 { font-size: 12px; color: var(--muted); margin: 16px 0 8px; letter-spacing: .04em; }
    .d-body h4:first-child { margin-top: 0; }
    .d-body ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; }
    .d-body .empty { color: var(--muted); font-size: 13px; list-style: none; margin-left: -18px; }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; padding: 16px; }
      .feed { position: static; max-height: 360px; }
      header { padding: 12px 16px; }
    }
    @media (max-width: 600px) {
      .office { grid-template-columns: 1fr; }
      .clock { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <small>HANKOOK MOLD · VIRTUAL OFFICE</small>
      <h1>한국몰드 AI 오피스</h1>
    </div>
    <div class="stats">
      <span class="stat">근무 중 <b id="s-work">0</b></span>
      <span class="stat">회의 중 <b id="s-meet">0</b></span>
      <span class="stat">오늘 완료 <b id="s-done">0</b>건</span>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="layout">
    <main class="office" id="office"></main>
    <aside class="feed">
      <h2>실시간 업무 로그</h2>
      <ol id="feed"></ol>
    </aside>
  </div>

  <dialog id="detail">
    <div class="d-head">
      <span class="team" id="d-team"></span>
      <h3 id="d-name"></h3>
      <p id="d-role"></p>
      <button class="close" aria-label="닫기" onclick="detail.close()">×</button>
    </div>
    <div class="d-body">
      <h4>현재 상태</h4>
      <div class="task" id="d-task"></div>
      <div class="bar"><i id="d-bar"></i></div>
      <h4>대기 중인 업무</h4>
      <ul id="d-queue"></ul>
      <h4>오늘 완료한 업무</h4>
      <ul id="d-done"></ul>
    </div>
  </dialog>

  <script>
    const staff = [
      {
        id: 'lee', name: '이은미', team: '관리팀', role: '전체 관리',
        hair: '#3b2a20', hairStyle: 'bob', shirt: '#0047ab', screen: '#7fb2ff', prop: 'calendar',
        tasks: ['주간 업무 보고 취합', '팀별 일정 조율', '근태 현황 점검', '경영 지표 업데이트', '회의록 정리', '결재 문서 검토', '거래처 계약서 확인'],
      },
      {
        id: 'kms', name: '김민성', team: '품질팀', role: '품질관리',
        hair: '#1e1e24', hairStyle: 'short', shirt: '#12a150', screen: '#8ee6b0', prop: 'chart',
        tasks: ['금형 치수 측정 결과 검토', '수입 검사 데이터 분석', '불량 원인 분석 (8D)', '품질 성적서 작성', '고객 클레임 대응', '공정 능력(Cpk) 점검', '시사출 샘플 검사'],
      },
      {
        id: 'kkh', name: '김강현', team: '생산관리팀', role: '생산관리',
        hair: '#2a2622', hairStyle: 'side', shirt: '#e08a00', screen: '#ffd27f', prop: 'gantt',
        tasks: ['주간 생산 계획 수립', '설비 가동률 모니터링', '납기 일정 점검', '자재 소요량 확인', '작업 지시서 발행', '금형 수정 일정 조율', '외주 가공 진행 확인'],
      },
      {
        id: 'kgw', name: '김건우', team: '개발팀', role: '개발관리',
        hair: '#4a3324', hairStyle: 'wavy', shirt: '#7b4fd6', screen: '#c6b1ff', prop: 'blueprint',
        tasks: ['신규 금형 사양 검토', '3D 모델링 검토', '시사출(T0) 결과 분석', '설계 변경(ECO) 관리', '개발 일정 관리', '고객 요구사항 정리', '금형 구조 DR 준비'],
      },
    ];

    const collabs = [
      ['kkh', 'kms', '시사출 일정 협의'],
      ['kgw', 'kkh', '설계 변경 반영 일정 협의'],
      ['kms', 'kgw', '치수 불량 개선 회의'],
      ['lee', 'kkh', '납기 현황 보고'],
      ['lee', 'kgw', '신규 프로젝트 킥오프'],
      ['lee', 'kms', '고객 품질 감사 준비'],
    ];

    const hairPaths = {
      bob: '<path d="M76 72c0-20 14-30 24-30s24 10 24 30v18h-6V74c-6-4-30-4-36 0v16h-6z"/>',
      short: '<path d="M78 70c0-18 12-26 22-26s22 8 22 26c-6-8-36-8-44 0z"/>',
      side: '<path d="M78 72c0-20 12-28 22-28s22 8 22 26c-10-10-26-4-32-12-4 6-8 10-12 14z"/>',
      wavy: '<path d="M77 72c-3-18 10-29 23-29 14 0 26 10 23 29-3-5-6-6-9-3-3-5-7-6-10-3-3-5-8-5-11 0-3-3-7-2-10 2-3-3-5-1-6 4z"/>',
    };

    const props = {
      calendar: `<rect x="22" y="30" width="44" height="40" rx="4" fill="var(--surface)" stroke="var(--line)"/>
        <rect x="22" y="30" width="44" height="10" rx="4" fill="#e5484d"/>
        ${[0,1,2,3].map(r => [0,1,2,3].map(c => `<rect x="${27+c*9}" y="${45+r*6}" width="6" height="3" rx="1" fill="var(--line)"/>`).join('')).join('')}`,
      chart: `<rect x="20" y="28" width="48" height="42" rx="4" fill="var(--surface)" stroke="var(--line)"/>
        <rect x="27" y="52" width="6" height="12" fill="#12a150"/><rect x="37" y="44" width="6" height="20" fill="#12a150"/>
        <rect x="47" y="48" width="6" height="16" fill="#12a150"/><rect x="57" y="38" width="6" height="26" fill="#12a150"/>`,
      gantt: `<rect x="16" y="28" width="56" height="42" rx="4" fill="var(--surface)" stroke="var(--line)"/>
        <rect x="22" y="35" width="26" height="5" rx="2" fill="#e08a00"/><rect x="32" y="44" width="30" height="5" rx="2" fill="#0047ab"/>
        <rect x="26" y="53" width="20" height="5" rx="2" fill="#12a150"/><rect x="44" y="62" width="22" height="5" rx="2" fill="#e08a00"/>`,
      blueprint: `<rect x="18" y="28" width="52" height="42" rx="4" fill="#1d4e9e"/>
        <circle cx="44" cy="49" r="12" fill="none" stroke="#cfe0ff" stroke-width="1.5"/>
        <path d="M26 49h36M44 33v32" stroke="#cfe0ff" stroke-width="1" stroke-dasharray="3 2"/>`,
    };

    function sceneSVG(p) {
      return `<svg viewBox="0 0 240 170" role="img" aria-label="${p.name} 자리">
        <rect width="240" height="110" fill="var(--wall)"/>
        <rect y="110" width="240" height="60" fill="var(--floor)"/>
        ${props[p.prop]}
        <rect x="186" y="26" width="34" height="44" rx="4" fill="#cfe6ff" stroke="var(--line)"/>
        <path d="M203 26v44M186 48h34" stroke="var(--line)" stroke-width="2"/>
        <g transform="translate(206 92)">
          <rect x="-8" y="10" width="16" height="16" rx="3" fill="#b5835a"/>
          <path d="M0 10c-14-6-10-22 0-24 10 2 14 18 0 24z" fill="#3aa36b"/>
          <path d="M0 10c-6-10 2-18 8-18 2 8-2 16-8 18z" fill="#2f8a59"/>
        </g>
        <rect x="70" y="100" width="60" height="44" rx="8" fill="#3a4250"/>
        <g class="person">
          <rect x="78" y="98" width="44" height="34" rx="12" fill="${p.shirt}"/>
          <rect x="95" y="94" width="10" height="8" fill="#f2c9a5"/>
          <g class="head">
            <circle cx="100" cy="78" r="21" fill="#f6d2b3"/>
            <g fill="${p.hair}">${hairPaths[p.hairStyle]}</g>
            <g class="eyes" fill="#1e1e24"><circle cx="92" cy="80" r="2.2"/><circle cx="108" cy="80" r="2.2"/></g>
            <path d="M95 88q5 4 10 0" stroke="#b5634a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <circle cx="87" cy="86" r="3" fill="#f3a9a0" opacity=".5"/><circle cx="113" cy="86" r="3" fill="#f3a9a0" opacity=".5"/>
          </g>
          <circle class="hand-l" cx="84" cy="128" r="5" fill="#f6d2b3"/>
          <circle class="hand-r" cx="116" cy="128" r="5" fill="#f6d2b3"/>
        </g>
        <rect x="30" y="130" width="180" height="12" rx="3" fill="var(--desk)"/>
        <rect x="30" y="140" width="180" height="4" fill="var(--desk-edge)"/>
        <rect x="40" y="144" width="6" height="22" fill="var(--desk-edge)"/><rect x="194" y="144" width="6" height="22" fill="var(--desk-edge)"/>
        <rect x="84" y="125" width="34" height="5" rx="1.5" fill="#5b6475"/>
        <g transform="translate(140 92)">
          <rect x="0" y="0" width="52" height="34" rx="3" fill="#2b3240"/>
          <rect x="3" y="3" width="46" height="28" rx="1.5" fill="#0f1622"/>
          <rect class="screen-line" x="7" y="8" width="30" height="3" rx="1" fill="${p.screen}"/>
          <rect class="screen-line" x="7" y="14" width="38" height="3" rx="1" fill="${p.screen}" style="animation-delay:.4s"/>
          <rect class="screen-line" x="7" y="20" width="22" height="3" rx="1" fill="${p.screen}" style="animation-delay:.8s"/>
          <rect x="22" y="34" width="8" height="5" fill="#2b3240"/><rect x="14" y="38" width="24" height="3" rx="1" fill="#2b3240"/>
        </g>
        <g transform="translate(52 118)">
          <rect x="0" y="0" width="12" height="12" rx="2" fill="var(--surface)" stroke="var(--line)"/>
          <path d="M12 3h3a3 3 0 0 1 0 6h-3" fill="none" stroke="var(--line)" stroke-width="1.5"/>
          <path class="steam" d="M4-3q2-3 0-6M8-3q2-3 0-6" stroke="var(--muted)" stroke-width="1" fill="none"/>
        </g>
      </svg>`;
    }

    // ---- state ----
    const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
    const byId = Object.fromEntries(staff.map(p => [p.id, p]));
    staff.forEach(p => {
      p.queue = shuffle(p.tasks);
      p.current = p.queue.shift();
      p.progress = Math.floor(Math.random() * 40);
      p.status = 'work';
      p.done = [];
      p.until = 0;
      p.note = '';
    });

    const office = document.getElementById('office');
    office.innerHTML = staff.map(p => `
      <button class="room" id="room-${p.id}" data-s="work" onclick="openDetail('${p.id}')">
        <div class="room-head">
          <span class="team">${p.team}</span>
          <span class="state" data-s="work"><i class="dot"></i><span>작업 중</span></span>
        </div>
        <div class="scene">${sceneSVG(p)}<div class="bubble"></div></div>
        <div class="room-foot">
          <div class="who"><b>${p.name}</b><span>${p.role}</span></div>
          <div class="task"></div>
          <div class="bar"><i></i></div>
        </div>
      </button>`).join('');

    const labels = { work: '작업 중', meet: '회의 중', rest: '휴식 중' };
    const now = () => new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    let doneCount = 0;
    let openId = null;

    function log(tag, text) {
      const li = document.createElement('li');
      li.innerHTML = `<time>${now()}</time><span class="tag">${tag}</span> ${text}`;
      const feed = document.getElementById('feed');
      feed.prepend(li);
      while (feed.children.length > 60) feed.lastChild.remove();
    }

    function render(p) {
      const room = document.getElementById('room-' + p.id);
      room.dataset.s = p.status;
      const st = room.querySelector('.state');
      st.dataset.s = p.status;
      st.lastElementChild.textContent = labels[p.status];
      const text = p.status === 'work' ? p.current : p.note;
      const bubble = room.querySelector('.bubble');
      const bubbleText = p.status === 'work' ? `💻 ${p.current}` : p.status === 'meet' ? `💬 ${p.note}` : '☕ 잠깐 휴식';
      if (bubble.textContent !== bubbleText) {
        bubble.textContent = bubbleText;
        bubble.style.animation = 'none'; bubble.offsetWidth; bubble.style.animation = '';
      }
      room.querySelector('.task').textContent = text;
      room.querySelector('.bar i').style.width = (p.status === 'work' ? p.progress : 0) + '%';
      if (openId === p.id) fillDetail(p);
    }

    function fillDetail(p) {
      document.getElementById('d-team').textContent = p.team;
      document.getElementById('d-name').textContent = p.name;
      document.getElementById('d-role').textContent = `${p.role} · ${labels[p.status]}`;
      document.getElementById('d-task').textContent = p.status === 'work' ? `${p.current} (${Math.floor(p.progress)}%)` : p.note;
      document.getElementById('d-bar').style.width = (p.status === 'work' ? p.progress : 0) + '%';
      const list = (items, empty) => items.length ? items.map(t => `<li>${t}</li>`).join('') : `<li class="empty">${empty}</li>`;
      document.getElementById('d-queue').innerHTML = list(p.queue.slice(0, 4), '대기 업무 없음');
      document.getElementById('d-done').innerHTML = list(p.done.slice().reverse(), '아직 완료한 업무가 없습니다');
    }

    function openDetail(id) {
      openId = id;
      fillDetail(byId[id]);
      detail.showModal();
    }
    detail.addEventListener('close', () => { openId = null; });

    function nextTask(p) {
      if (!p.queue.length) p.queue = shuffle(p.tasks.filter(t => t !== p.current));
      p.current = p.queue.shift();
      p.progress = 0;
    }

    function tick() {
      const t = Date.now();
      staff.forEach(p => {
        if (p.status !== 'work') {
          if (t >= p.until) {
            if (p.status === 'meet') log(p.name, `회의 종료 · ${p.note}`);
            p.status = 'work';
            log(p.name, `업무 복귀 · ${p.current}`);
          }
        } else {
          p.progress = Math.min(100, p.progress + 1 + Math.random() * 3);
          if (p.progress >= 100) {
            p.done.push(p.current);
            doneCount++;
            log(p.name, `완료 ✔ ${p.current}`);
            nextTask(p);
            log(p.name, `착수 · ${p.current}`);
          } else if (Math.random() < 0.004) {
            p.status = 'rest'; p.note = '잠깐 휴식'; p.until = t + 6000 + Math.random() * 6000;
            log(p.name, '커피 한 잔 ☕');
          }
        }
        render(p);
      });

      if (Math.random() < 0.02) {
        const free = collabs.filter(([a, b]) => byId[a].status === 'work' && byId[b].status === 'work');
        if (free.length) {
          const [a, b, topic] = free[Math.floor(Math.random() * free.length)];
          const until = t + 10000 + Math.random() * 10000;
          [byId[a], byId[b]].forEach(p => { p.status = 'meet'; p.note = topic; p.until = until; render(p); });
          log(`${byId[a].name} → ${byId[b].name}`, `회의 시작 · ${topic}`);
        }
      }

      document.getElementById('s-work').textContent = staff.filter(p => p.status === 'work').length;
      document.getElementById('s-meet').textContent = staff.filter(p => p.status === 'meet').length;
      document.getElementById('s-done').textContent = doneCount;
      document.getElementById('clock').textContent = new Date().toLocaleString('ko-KR', {
        month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
      });
    }

    log('오피스', 'AI 직원 4명 출근 완료');
    staff.forEach(p => log(p.name, `착수 · ${p.current}`));
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
